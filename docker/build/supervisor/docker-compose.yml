version: '3.8'

# 使用 Supervisor 管理多个队列工作进程的方案
# 这个方案在一个容器内运行多个 queue:work 进程

services:
  # Web 应用容器
  app:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: job-executor-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - app-network
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
    depends_on:
      - db
      - redis
    command: php-fpm

  # Nginx
  nginx:
    image: nginx:alpine
    container_name: job-executor-nginx
    restart: unless-stopped
    ports:
      - "8199:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - app

  # 队列工作进程容器（使用 Supervisor 管理多个进程）
  queue-worker:
    build:
      context: ../../..
      dockerfile: Dockerfile
    container_name: job-executor-queue-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - app-network
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - QUEUE_WORKER_NUM=${QUEUE_WORKER_NUM:-4}  # 工作进程数量
    depends_on:
      - db
      - redis
    # Supervisor 会自动管理多个 queue:work 进程
    command: /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

  # 数据库
  db:
    image: mysql:8.0
    container_name: job-executor-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-network
    ports:
      - "3306:3306"

  # Redis
  redis:
    image: redis:7-alpine
    container_name: job-executor-redis
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
  redis-data:

